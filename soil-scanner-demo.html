<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Soil Scanning Robot Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    h1 {
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <h1>Soil Scanning Robot - Demo</h1>

  <div class="gallery">
    <img src="assets/projects/soil-scanner/soil-1.jpeg">
    <img src="assets/projects/soil-scanner/soil-2.jpeg">
    <img src="assets/projects/soil-scanner/soil-3.jpeg">
    <img src="assets/projects/soil-scanner/soil-4.jpeg">
    <img src="assets/projects/soil-scanner/soil-5.jpg">
  </div>

</body>
</html>
