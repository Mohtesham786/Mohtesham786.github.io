<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drawing Simulator Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 40px 20px;
    }

    .wrap {
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 40px;
    }

    h2 {
      margin-top: 40px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    video, img {
      width: 100%;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>ROS 2 Drawing Simulator</h1>
    <p class="subtitle">Demo: Videos and Photos</p>

    <!-- 🎥 VIDEOS -->
    <h2>Videos</h2>
    <div class="grid">

      <video controls>
        <source src="assets/projects/drawing-simulator/videos/painting-robot-1.mp4" type="video/mp4">
      </video>

      <video controls>
        <source src="assets/projects/drawing-simulator/videos/painting-robot-2.mp4" type="video/mp4">
      </video>

    </div>

    <!-- 📸 PHOTOS -->
    <h2>Photos</h2>
    <div class="grid">

      <img src="assets/projects/drawing-simulator/photos/simulator-1.jpg">
      <img src="assets/projects/drawing-simulator/photos/simulator-2.jpg">
      <img src="assets/projects/drawing-simulator/photos/simulator-3.jpg">
      <img src="assets/projects/drawing-simulator/photos/simulator-4.jpg">
      <img src="assets/projects/drawing-simulator/photos/simulator-5.jpg">

    </div>

  </div>
</body>
</html>
