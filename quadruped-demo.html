<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quadruped Robot Dog Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 40px 20px;
    }

    .wrap {
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 40px;
    }

    h2 {
      margin-top: 40px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      align-items: start;
    }

    /* 🎥 Videos */
    .grid video {
      width: 100%;
      height: 220px;
      object-fit: contain;   /* keep full video visible */
      background: black;
      border-radius: 12px;
      display: block;
    }

    /* 📸 Photos */
    .grid img {
      width: 100%;
      height: 220px;
      object-fit: cover;     /* crop nicely */
      border-radius: 12px;
      display: block;
      transition: transform 0.3s ease;
    }

    /* ✨ Hover effect (nice touch) */
    .grid img:hover {
      transform: scale(1.05);
    }

  </style>
</head>

<body>
  <div class="wrap">

    <h1>Quadruped Robot Dog</h1>
    <p class="subtitle">Demo: Videos and Photos</p>

    <!-- 🎥 VIDEOS -->
    <h2>Videos</h2>
    <div class="grid">

      <video controls>
        <source src="assets/projects/quadruped-robot-dog/videos/midog-video-1.mp4" type="video/mp4">
      </video>

      <video controls>
        <source src="assets/projects/quadruped-robot-dog/videos/midog-video-2.mp4" type="video/mp4">
      </video>

    </div>

    <!-- 📸 PHOTOS -->
    <h2>Photos</h2>
    <div class="grid">

      <img src="assets/projects/quadruped-robot-dog/photos/midog-1.jpg">
      <img src="assets/projects/quadruped-robot-dog/photos/midog-2.jpg">
      <img src="assets/projects/quadruped-robot-dog/photos/midog-3.jpg">
      <img src="assets/projects/quadruped-robot-dog/photos/midog-4.jpg">
      <img src="assets/projects/quadruped-robot-dog/photos/midog-5.jpg">
      <img src="assets/projects/quadruped-robot-dog/photos/midog-6.jpg">

    </div>

  </div>
</body>
</html>
